server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache images for a long time (they don't change often)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Basic gzip for faster loading
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}
